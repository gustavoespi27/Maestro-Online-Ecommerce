# Compila el proyecto y escanea dependencias y secretos en cada push, pull request y una vez por semana.
name: Compilación y seguridad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 1"   # lunes 12:00 UTC

permissions:
  contents: read

jobs:
  compilar-y-escanear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo para buscar secretos en todos los commits

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar y compilar (advertencias = error)
        run: |
          dotnet restore Ferreteria/Ferreteria.csproj
          dotnet build Ferreteria/Ferreteria.csproj -c Release --no-restore -warnaserror

      - name: Escanear paquetes NuGet vulnerables (incluye dependencias indirectas)
        run: |
          dotnet list Ferreteria/Ferreteria.csproj package --vulnerable --include-transitive 2>&1 | tee vulnerables.txt
          if grep -q -i "has the following vulnerable packages" vulnerables.txt; then
            echo "::error::Hay paquetes con vulnerabilidades conocidas"; exit 1
          fi

      # Se usa el binario de gitleaks directamente y se escanea el historial completo: gitleaks-action calcula
      # el rango desde el padre del primer commit del push, que no existe cuando el push incluye el commit raíz.
      - name: Buscar secretos en el historial de Git
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact -v --exit-code 1
